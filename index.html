<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pear Store - Space Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');
        :root { --cyan: #00d4ff; --gold: #ffd700; --red: #ff4d4d; --glass: rgba(255,255,255,0.07); --glass-border: rgba(255,255,255,0.15); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow-x: hidden; background: #000; color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; }
        #space { position: fixed; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%); top: 0; left: 0; }
        
        /* Armutların yukarıdan pürüzsüz başlaması için top değeri eklendi */
        .pear-fall { position: absolute; font-size: 28px; animation: fall linear infinite; pointer-events: none; opacity: 0.6; top: -40px; }
        @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }
        
        .tab-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); height: 58px; }
        .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 10px; }
        .tab-btn { background: none; border: none; color: rgba(255,255,255,0.55); font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600; padding: 8px 15px; cursor: pointer; border-radius: 6px; transition: 0.25s; white-space: nowrap; text-transform: uppercase; }
        .tab-btn.active { color: var(--cyan); background: rgba(0,212,255,0.12); box-shadow: inset 0 -2px 0 var(--cyan); }
        
        .page { display: none; padding: 100px 20px 40px; min-height: 100vh; text-align: center; }
        .page.active { display: block; }
        .card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); padding: 25px; border-radius: 20px; max-width: 600px; margin: 0 auto 20px; }
        .product-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .product-card { background: var(--glass); border: 1px solid var(--glass-border); padding: 10px; border-radius: 15px; width: 190px; }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; background: #111; display: block; border: 1px solid var(--glass-border); }
        input, textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); border-radius: 8px; color: white; margin-bottom: 10px; font-family: inherit; }
        input:focus, textarea:focus { outline: 1px solid var(--cyan); }
        .main-btn { background: var(--cyan); color: #000; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .main-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div id="space"></div>

<nav class="tab-nav">
    <div class="tabs">
        <button class="tab-btn active" data-tab="home" onclick="showTab('home')">🏠 Mağaza</button>
        <button class="tab-btn" data-tab="news" onclick="showTab('news')">📰 Haberler</button>
        <button class="tab-btn" data-tab="giveaway" onclick="showTab('giveaway')">🎁 Çekiliş</button>
        <button class="tab-btn" data-tab="about" onclick="showTab('about')">ℹ️ Ekip</button>
        <button class="tab-btn" data-tab="admin" onclick="showTab('admin')" style="color:var(--gold);">🔒 Yetkili</button>
    </div>
</nav>

<section id="page-home" class="page active">
    <h1 style="font-family:'Orbitron'; color:var(--cyan); margin-bottom:30px;">PEAR STORE</h1>
    <div class="product-grid">
        <div class="product-card"><img src="https://i.ibb.co/LhyxVw7/image-87ba7e.png"><h3>TPear 19 Pro</h3></div>
        <div class="product-card"><img src="https://i.ibb.co/3WfPrvX/image-87baf1.png"><h3>TPear 20 Air</h3></div>
        <div class="product-card"><img src="https://i.ibb.co/Yy7r93Y/image-87b71a.jpg"><h3>MPear Samuray</h3></div>
        <div class="product-card"><img src="https://i.ibb.co/m0fHpxm/image-87b792.jpg"><h3>MPear Fantastic</h3></div>
        <div class="product-card"><img src="https://i.ibb.co/V972v9k/image-87b3b4.jpg"><h3>KPear 1</h3></div>
    </div>
</section>

<section id="page-news" class="page">
    <h2 style="font-family:'Orbitron'; margin-bottom:20px;">GÜNCEL HABERLER</h2>
    <div id="news-container"></div>
</section>

<section id="page-about" class="page">
    <div class="card">
        <h2 style="color:var(--cyan); font-family:'Orbitron';">HTML ÇAĞRI EKİBİ</h2>
        <div style="text-align:left; margin-top:20px;">
            <p style="margin-bottom:10px;"><strong style="color:var(--gold);">Başkan:</strong> Ömer Faruk Türkoğlu</p>
            <p><strong>Yazılımcı:</strong> Çağrı Atav</p>
        </div>
    </div>
</section>

<section id="page-giveaway" class="page">
    <div class="card">
        <h2 style="font-family:'Orbitron'; color:var(--gold);">🎁 HEDİYE ÇEKİLİŞİ</h2>
        <input type="text" id="gName" placeholder="Ad Soyad">
        <input type="text" id="gClass" placeholder="Sınıf">
        <div style="text-align:left; font-size:13px; margin-bottom:10px; display:flex; align-items:center; gap:5px;">
            <input type="checkbox" id="gTerms" style="width:auto; margin-bottom:0;"> <span>Anlamsız adlar kabul edilmeyecektir.</span>
        </div>
        <button class="main-btn" onclick="joinGiveaway()" style="background:var(--gold);">KATIL</button>
    </div>
</section>

<section id="page-admin" class="page">
    <div id="adminLogin" class="card" style="max-width:400px;">
        <h2>🔒 YETKİLİ GİRİŞİ</h2>
        <input type="password" id="adminPw" placeholder="Yetkili Kodu" onkeydown="if(event.key === 'Enter') loginAdmin()">
        <button class="main-btn" onclick="loginAdmin()">GİRİŞ</button>
    </div>
    <div id="adminPanel" style="display:none; text-align:left;">
        <div class="card">
            <h3>Haber Ekle (24 Saat Kalır)</h3>
            <input type="text" id="nTitle" placeholder="Başlık">
            <textarea id="nBody" placeholder="İçerik" rows="4"></textarea>
            <button class="main-btn" onclick="addNews()">YAYINLA</button>
        </div>
        <div class="card">
            <h3>Çekiliş Yönetimi</h3>
            <button class="main-btn" onclick="startGiveaway()">BAŞLAT</button>
            <button class="main-btn" onclick="stopDraw()" style="background:var(--red); color:white;">DURDUR</button>
            <button class="main-btn" onclick="clearParticipants()" style="background:#444; color:white;">TEMİZLE</button>
            <h2 id="winnerName" style="color:var(--gold); margin-top:15px; text-align:center; font-family:'Orbitron';">---</h2>
        </div>
    </div>
</section>

<script>
    let news = JSON.parse(localStorage.getItem('p_news')) || [];
    let participants = JSON.parse(localStorage.getItem('p_parts')) || [];
    let drawInterval;
    let isDrawing = false;

    function save() {
        localStorage.setItem('p_news', JSON.stringify(news));
        localStorage.setItem('p_parts', JSON.stringify(participants));
    }

    function cleanOldNews() {
        const now = new Date().getTime();
        const day = 24 * 60 * 60 * 1000;
        news = news.filter(n => (now - n.time) < day);
        save();
    }

    function showTab(t) {
        cleanOldNews();
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById('page-'+t).classList.add('active');
        
        // Aktif butonun stilini güncelleme hatası düzeltildi
        const activeBtn = document.querySelector(`.tab-btn[data-tab="${t}"]`);
        if(activeBtn) activeBtn.classList.add('active');
        
        if(t === 'news') renderNews();
    }

    function renderNews() {
        const container = document.getElementById('news-container');
        container.innerHTML = news.length ? news.map(n => `<div class="card" style="text-align:left;"><h3>${n.t}</h3><p style="margin-top:10px; color:rgba(255,255,255,0.8);">${n.b}</p></div>`).reverse().join('') : "<p>Aktif haber yok.</p>";
    }

    function addNews() {
        const t = document.getElementById('nTitle').value.trim();
        const b = document.getElementById('nBody').value.trim();
        if(t && b) {
            news.push({t, b, time: new Date().getTime()});
            save(); 
            alert("Haber yayınlandı!");
            document.getElementById('nTitle').value = ''; 
            document.getElementById('nBody').value = '';
        } else {
            alert("Lütfen tüm alanları doldurun!");
        }
    }

    function joinGiveaway() {
        const n = document.getElementById('gName').value.trim();
        const c = document.getElementById('gClass').value.trim();
        const t = document.getElementById('gTerms').checked;
        if(n.length > 2 && c && t) { 
            participants.push({n, c}); 
            save(); 
            alert("Çekilişe katıldınız!"); 
            // Formu temizleme eklendi
            document.getElementById('gName').value = '';
            document.getElementById('gClass').value = '';
            document.getElementById('gTerms').checked = false;
        } else {
            alert("Lütfen formu eksiksiz doldurun ve şartı onaylayın (İsim en az 3 harf olmalıdır).");
        }
    }

    function startGiveaway() {
        if(!participants.length) return alert("Katılımcı yok!");
        if(isDrawing) return;
        isDrawing = true;
        clearInterval(drawInterval);
        drawInterval = setInterval(() => {
            let r = participants[Math.floor(Math.random() * participants.length)];
            document.getElementById('winnerName').innerText = r.n + " (" + r.c + ")";
        }, 60);
    }

    function stopDraw() { 
        if(!isDrawing) return;
        clearInterval(drawInterval); 
        isDrawing = false;
        alert("Kazanan belirlendi: " + document.getElementById('winnerName').innerText);
    }

    function clearParticipants() {
        if(confirm("Tüm katılımcı listesini silmek istediğinize emin misiniz?")) {
            participants = [];
            save();
            document.getElementById('winnerName').innerText = "---";
            alert("Katılımcı listesi temizlendi.");
        }
    }

    function loginAdmin() {
        if(document.getElementById('adminPw').value === 'Piır6791181') {
            document.getElementById('adminLogin').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        } else {
            alert("Hatalı kod!");
        }
    }

    cleanOldNews();

    // Düşüş hızları ve varyasyonları yumuşatıldı
    for(let i=0; i<30; i++) {
        let p = document.createElement('div'); p.className = 'pear-fall'; p.innerHTML = '🍐';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (Math.random() * 3 + 3) + 's';
        p.style.animationDelay = (Math.random() * 5) + 's';
        document.getElementById('space').appendChild(p);
    }
</script>
</body>
</html>
